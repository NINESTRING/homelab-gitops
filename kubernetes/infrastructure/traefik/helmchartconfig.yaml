apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # 기본 TLS 인증서: cert-manager 가 kube-system 에 만드는 와일드카드 Secret.
    # Secret 이 아직 없으면 Traefik 자체 서명 인증서로 동작하다가 생기면 자동 전환.
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-thatsmycodename-com-tls
    # 차트 v28 이후 리다이렉트는 ports.<name>.http.redirections 아래 (http 단계 주의)
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

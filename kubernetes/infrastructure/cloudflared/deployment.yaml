apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  # 설정 변경이나 이미지 갱신으로 재배포될 때 터널이 끊기지 않도록 2개
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
          ports:
            - name: metrics
              containerPort: 2000
          # /ready 는 엣지와 연결이 하나 이상 맺어졌을 때만 200
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: tunnel-credentials

# 플랫폼 서비스는 여기 고정으로 둔다. 애플리케이션(kubernetes/apps/*)은 Ingress 어노테이션으로 자동 등록되므로 여기 적지 않는다.
# 위젯 URL 은 클러스터 내부 Service 주소(Ingress 의 forward auth 를 타지 않도록).
- 플랫폼:
    - Argo CD:
        href: https://argocd.thatsmycodename.com
        icon: argocd
        description: GitOps
        siteMonitor: http://argocd-server.argocd.svc.cluster.local/healthz
    - Authentik:
        href: https://auth.thatsmycodename.com
        icon: authentik
        description: SSO
        siteMonitor: http://authentik-server.authentik.svc.cluster.local/-/health/live/
    - Grafana:
        href: https://grafana.thatsmycodename.com
        icon: grafana
        description: 모니터링 대시보드
        widget:
          type: grafana
          version: 2
          url: http://kps-grafana.monitoring.svc.cluster.local
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
    - Prometheus:
        icon: prometheus
        description: 메트릭 (Ingress 없음, 위젯만)
        widget:
          type: prometheus
          url: http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

# TLS 블록 없음: Traefik 기본 인증서(와일드카드). external-dns 가 CNAME 을 만든다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  annotations:
    external-dns.kubernetes.io/target: macmini.thatsmycodename.com
    # Authentik forward auth. 프로바이더/앱은 terraform/20-authentik/homepage.tf
    traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: home.thatsmycodename.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http

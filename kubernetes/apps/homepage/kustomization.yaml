# Homepage (gethomepage.dev): 홈랩 대시보드. https://home.thatsmycodename.com (Tailscale 전용, Authentik forward auth)
# 설정은 config/ 아래 YAML 을 configMapGenerator 로 묶는다. 내용이 바뀌면 ConfigMap 이름(해시)이 바뀌어 Pod 가 자동 재배포된다.
# 위젯용 자격 증명은 homepage-secrets.sops.yaml (HOMEPAGE_VAR_* 환경변수 → 설정 안에서 {{HOMEPAGE_VAR_*}} 로 치환).
# 다른 앱은 Ingress 에 gethomepage.dev/* 어노테이션만 달면 자동으로 타일이 생긴다 (예: apps/whoami/ingress.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: homepage-config
    files:
      - config/kubernetes.yaml
      - config/settings.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/bookmarks.yaml
      - config/docker.yaml
      - config/custom.css
      - config/custom.js

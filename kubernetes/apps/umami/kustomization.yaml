# Umami: 쿠키 없는 웹 분석. 개인 사이트(thatsmycodename.com)의 방문 통계를 모은다.
# 대시보드는 https://umami.thatsmycodename.com (Tailscale 전용, Umami 자체 로그인).
# 인터넷에는 수집에 필요한 두 경로만 연다: thatsmycodename.com/script.js 와 /api/send
# (kubernetes/infrastructure/cloudflared/config.yaml 의 path 규칙). 사이트와 같은 출처라 CORS 도 필요 없다.
# 시크릿: umami-secrets.sops.yaml (APP_SECRET, POSTGRES_PASSWORD, 참고용 관리자 비밀번호).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: umami
resources:
  - namespace.yaml
  - statefulset.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
generators:
  - secret-generator.yaml

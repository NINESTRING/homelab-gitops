# 인터넷에 공개하는 사이트. 루트 도메인의 DNS 는 Cloudflare Tunnel 을 가리키므로(프록시 켬) 실제 트래픽은
# Cloudflare 엣지 → cloudflared → site Service 로 흐르고 Traefik 을 거치지 않는다
# (라우팅 규칙: kubernetes/infrastructure/cloudflared/config.yaml).
# DNS 레코드는 external-dns 가 아니라 Terraform 이 관리한다 (terraform/00-foundation/cloudflare.tf 의 apex):
# external-dns 는 루트 도메인에 소유 표시 TXT 를 만들 수 없어 레코드를 갱신하지 못한다. 그래서 controller 어노테이션으로
# 이 Ingress 를 external-dns 대상에서 뺀다. Ingress 자체는 Homepage 타일의 근거로 남긴다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  annotations:
    external-dns.kubernetes.io/controller: terraform   # dns-controller 가 아닌 값이면 external-dns 가 무시
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: 개인 사이트
    gethomepage.dev/group: 앱
    gethomepage.dev/icon: mdi-web
    gethomepage.dev/description: 블로그, 이력서, 포트폴리오
    gethomepage.dev/pod-selector: app=site
spec:
  ingressClassName: traefik
  rules:
    - host: thatsmycodename.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  number: 80

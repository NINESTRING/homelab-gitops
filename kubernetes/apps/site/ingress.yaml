# 인터넷에 공개하는 사이트. DNS 가 Cloudflare Tunnel 을 가리키므로(프록시 켬) 실제 트래픽은
# Cloudflare 엣지 → cloudflared → site Service 로 흐르고 Traefik 을 거치지 않는다
# (라우팅 규칙: kubernetes/infrastructure/cloudflared/config.yaml).
# 이 Ingress 는 external-dns 의 DNS 레코드와 Homepage 타일의 근거로 남긴다.
# Tailscale 전용으로 되돌리려면 target 을 macmini.thatsmycodename.com 으로 바꾸고 cloudflare-proxied 줄을 지운다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  annotations:
    external-dns.kubernetes.io/target: a6b8c799-8ef4-412d-b552-bab744da3469.cfargotunnel.com
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: 개인 사이트
    gethomepage.dev/group: 앱
    gethomepage.dev/icon: mdi-web
    gethomepage.dev/description: 블로그, 이력서, 포트폴리오
    gethomepage.dev/pod-selector: app=site
spec:
  ingressClassName: traefik
  rules:
    - host: thatsmycodename.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: site
          # 공개 GHCR 패키지 (pull secret 없음). 태그는 YYYY.MM.DD.N.
          # 사이트 레포의 Image 워크플로(deploy job)가 빌드 직후 이 줄을 고쳐 main 에 푸시한다. 형식을 바꾸면 그쪽 sed 도 고친다.
          image: ghcr.io/ninestring/thatsmycodename.com:2026.11.13.2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }

# kubernetes/ 매니페스트 정적 검사. 푸시되면 Argo CD 가 바로 적용하므로 PR 단계에서 잡는다.
# SOPS 시크릿은 CI 에서 복호화하지 않는다 (age 키를 GitHub 에 두지 않음). scripts/render.sh 가 시크릿 생성기를 빼고 렌더링한다.
name: kubernetes

on:
  pull_request:
    paths: ["kubernetes/**", "scripts/**", ".yamllint.yaml", ".github/workflows/kubernetes.yml"]
  push:
    branches: [main]
    paths: ["kubernetes/**", "scripts/**", ".yamllint.yaml", ".github/workflows/kubernetes.yml"]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: yamllint
        run: |
          pip install --quiet yamllint==1.38.0
          yamllint .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 렌더링 (kustomize + helm)
        run: scripts/render.sh

      # CRD 정의 자체는 upstream 차트 것이라 건너뛴다. CR(Certificate, IngressRoute 등)은 CRDs-catalog 스키마로 검사한다.
      # 새 종류의 CR 을 추가했는데 카탈로그에 스키마가 없으면 실패한다. 그때는 -skip 에 kind 를 추가한다.
      - name: kubeconform (스키마 검사)
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          args: >-
            -strict -summary
            -kubernetes-version 1.37.2
            -skip CustomResourceDefinition
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            .rendered

      - name: 모든 이미지에 linux/arm64 가 있는지
        run: scripts/images.sh | scripts/check-arm64.sh

# Argo CD Helm values. Terraform 10-cluster-bootstrap 이 적용한다.
# 클러스터 안 다른 모든 것은 Argo CD 가 관리하지만 Argo CD 자신은 Terraform 이 설치한다.
global:
  domain: argocd.thatsmycodename.com

configs:
  params:
    # TLS 는 Traefik 이 종료. Argo CD 는 평문 HTTP 로 받는다
    server.insecure: true
  cm:
    # KSOPS(kustomize exec 플러그인) + kustomize helmCharts 허용
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec --enable-helm
    # 리소스 상태 추적을 어노테이션으로 (라벨 63자 제한 회피)
    application.resourceTrackingMethod: annotation

# ---------------------------------------------------------------- Ingress (Phase 3)
# TLS 는 Traefik 기본 인증서(와일드카드)로 종료되므로 tls 블록 없이 둔다. Tailscale 안에서만 열림.
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      external-dns.alpha.kubernetes.io/target: macmini.thatsmycodename.com

# ---------------------------------------------------------------- repo-server: KSOPS + age
repoServer:
  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
      readOnly: true

# ---------------------------------------------------------------- 단일 노드 리소스 절약
# 알림은 Phase 5 에서 Alertmanager 로 처리하므로 끈다
notifications:
  enabled: false
# Dex 는 Phase 4 에서 Authentik OIDC 를 직접 붙일지 결정. 그때까지 끈다
dex:
  enabled: false

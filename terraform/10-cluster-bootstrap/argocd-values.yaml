# Argo CD Helm values. Terraform 10-cluster-bootstrap 이 적용한다.
# 클러스터 안 다른 모든 것은 Argo CD 가 관리하지만 Argo CD 자신은 Terraform 이 설치한다.
global:
  domain: argocd.thatsmycodename.com

configs:
  params:
    # TLS 는 Traefik 이 종료. Argo CD 는 평문 HTTP 로 받는다
    server.insecure: true
  cm:
    # KSOPS(kustomize exec 플러그인) + kustomize helmCharts 허용
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec --enable-helm
    # 리소스 상태 추적을 어노테이션으로 (라벨 63자 제한 회피)
    application.resourceTrackingMethod: annotation
    # Authentik OIDC (Phase 4). 클라이언트 시크릿은 Secret argocd-oidc (kubernetes/infrastructure/argocd-config, SOPS).
    # Authentik 쪽 프로바이더/앱은 terraform/20-authentik.
    oidc.config: |
      name: Authentik
      issuer: https://auth.thatsmycodename.com/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes: ["openid", "profile", "email"]
    # Homepage 대시보드 위젯용 로컬 계정. UI 로그인 불가, API 토큰만. 토큰은 kubernetes/apps/homepage/homepage-secrets.sops.yaml
    accounts.homepage: apiKey
    # 로컬 admin 비활성화 (2026-11-10). 로그인은 Authentik 만. SSO 가 고장나 잠기면 이 값을 "true" 로 바꿔 apply 하면
    # argocd-initial-admin-secret 의 비밀번호로 다시 들어갈 수 있다.
    admin.enabled: "false"
  # Authentik 그룹 → Argo CD 역할. admins 만 관리자, 나머지 로그인 사용자는 읽기 전용.
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, admins, role:admin
      g, homepage, role:readonly
    scopes: "[groups, email]"

# ---------------------------------------------------------------- Ingress (Phase 3)
# TLS 는 Traefik 기본 인증서(와일드카드)로 종료되므로 tls 블록 없이 둔다. Tailscale 안에서만 열림.
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      external-dns.kubernetes.io/target: macmini.thatsmycodename.com

# ---------------------------------------------------------------- repo-server: KSOPS + age
repoServer:
  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  # kustomize 는 Argo CD 내장 버전을 쓴다. ksops 이미지의 kustomize(v5.3)는 `helm version -c` 를 호출해 Helm 3 에서 실패한다.
  volumeMounts:
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
      readOnly: true

# ---------------------------------------------------------------- 단일 노드 리소스 절약
# 알림은 Phase 5 에서 Alertmanager 로 처리하므로 끈다
notifications:
  enabled: false
# Dex 는 Phase 4 에서 Authentik OIDC 를 직접 붙일지 결정. 그때까지 끈다
dex:
  enabled: false
